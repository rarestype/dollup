name: Deploy

permissions:
    contents: write
on:
    workflow_dispatch:
        inputs:
            version:
                description: 'The version to deploy'
                required: true
                type: string
    workflow_call:
        inputs:
            version:
                description: 'The version to deploy'
                required: true
                type: string
            executable:
                description: 'The executable product name'
                required: false
                default: 'dollup'
                type: string
            repository:
                description: 'The downstream binary distribution repository'
                required: false
                default: 'ordo-one/dollup'
                type: string

jobs:
    macOS:
        runs-on: xcode-27
        env:
            DEPLOY_VERSION: ${{ inputs.version }}
            DEPLOY_PRODUCT: ${{ inputs.executable || 'dollup' }}
        steps:
            -   name: 🎀 Setup R2 🎀
                uses: rarestype/r2-setup-action@v1
                with:
                    cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
                    r2-access-key-id: ${{ secrets.R2_ACCESS_KEY }}
                    r2-access-key: ${{ secrets.R2_ACCESS_SECRET }}

            -   name: 🎀 Checkout repository 🎀
                uses: actions/checkout@v6

            -   name: 🎀 Select Xcode 27.2 🎀
                run: sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer

            -   name: 🎀 Build for distribution 🎀
                run: Scripts/Package

            -   name: 🎀 Deploy prebuilts 🎀
                uses: rarestype/r2-release-action@v1
                with:
                    from: .
                    include: ${{ inputs.executable || 'dollup' }}.artifactbundle
                    archive: ${{ inputs.executable || 'dollup' }}.artifactbundle.zip
                    version: ${{ inputs.version }}
                    bucket: rarest
    Linux:
        strategy:
            matrix:
                platform:
                    -   name: "Ubuntu (x86_64)"
                        runs-on: ubuntu-24.04

                    -   name: "Ubuntu (aarch64)"
                        runs-on: ubuntu-24.04-arm

        runs-on: ${{ matrix.platform['runs-on'] }}
        name: ${{ matrix.platform.name }}
        env:
            DEPLOY_VERSION: ${{ inputs.version }}
            DEPLOY_PRODUCT: ${{ inputs.executable || 'dollup' }}
        steps:
            -   name: 🎀 Setup R2 🎀
                uses: rarestype/r2-setup-action@v1
                with:
                    cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
                    r2-access-key-id: ${{ secrets.R2_ACCESS_KEY }}
                    r2-access-key: ${{ secrets.R2_ACCESS_SECRET }}

            -   name: 🎀 Checkout repository 🎀
                uses: actions/checkout@v6

            -   name: 🎀 Install Swift 🎀
                uses: rarestype/swift-install-action@v1
                with:
                    swift-release: 6.4.1-RELEASE

            -   name: 🎀 Build for distribution 🎀
                run: Scripts/Package

            -   name: 🎀 Deploy prebuilts 🎀
                uses: rarestype/r2-release-action@v1
                with:
                    from: .
                    include: ${{ inputs.executable || 'dollup' }}.artifactbundle
                    archive: ${{ inputs.executable || 'dollup' }}.artifactbundle.zip
                    version: ${{ inputs.version }}
                    bucket: rarest

    release:
        needs: [macOS, Linux]
        runs-on: xcode-27
        name: Release
        env:
            DEPLOY_VERSION: ${{ inputs.version }}
            DEPLOY_PRODUCT: ${{ inputs.executable || 'dollup' }}
        steps:
            -   name: 🎀 Checkout repository 🎀
                uses: actions/checkout@v6
                with:
                    repository: ${{ inputs.repository || 'ordo-one/dollup' }}
                    token: ${{ secrets.ORDO_RELEASE_PAT }}
                    path: downstream

            -   name: 🎀 Generate distribution repository 🎀
                run: |
                    HOST="https://get.rarestype.com/${DEPLOY_PRODUCT}/${DEPLOY_VERSION}"
                    ARCHIVE="${DEPLOY_PRODUCT}.artifactbundle.zip"

                    BUNDLE_URL_LINUX_AARCH64="${HOST}/Linux-aarch64/${ARCHIVE}"
                    BUNDLE_URL_LINUX_X86_64="${HOST}/Linux-x86_64/${ARCHIVE}"
                    BUNDLE_URL_MACOS_ARM64="${HOST}/macOS-arm64/${ARCHIVE}"

                    echo "macOS Bundle URL: ${BUNDLE_URL_MACOS_ARM64}"
                    echo "Linux Bundle URL (x86_64): ${BUNDLE_URL_LINUX_X86_64}"
                    echo "Linux Bundle URL (aarch64): ${BUNDLE_URL_LINUX_AARCH64}"

                    curl "${BUNDLE_URL_LINUX_AARCH64}" -o Linux-aarch64.zip
                    curl "${BUNDLE_URL_LINUX_X86_64}" -o Linux-x86_64.zip
                    curl "${BUNDLE_URL_MACOS_ARM64}" -o macOS-arm64.zip

                    unzip -q macOS-arm64.zip

                    ./${DEPLOY_PRODUCT}.artifactbundle/arm64/${DEPLOY_PRODUCT} distribute \
                        --output downstream \
                        --macOS "${BUNDLE_URL_MACOS_ARM64}" \
                        --linux-x86-64 "${BUNDLE_URL_LINUX_X86_64}" \
                        --linux-aarch64 "${BUNDLE_URL_LINUX_AARCH64}"

                    cd downstream

                    git config user.name "rarest automation"
                    git config user.email "automation@noreply.rarestype.com"

                    git rm -f --ignore-unmatch Package.template.swift
                    git add Package.swift Plugins
                    git commit -m "Release ${DEPLOY_VERSION}"
                    git tag "${DEPLOY_VERSION}"
                    git push origin master
                    git push origin refs/tags/${DEPLOY_VERSION}

            -   name: 🎀 Publish release 🎀
                uses: softprops/action-gh-release@v2
                with:
                    repository: ${{ inputs.repository || 'ordo-one/dollup' }}
                    tag_name: ${{ inputs.version }}
                    name: ${{ inputs.version }}
                    token: ${{ secrets.ORDO_RELEASE_PAT }}

            -   name: 🎀 Update badge 🎀
                uses: rarestype/rarestbadge@v1
                if: always()
                with:
                    badge: SemanticRelease/_all
                    title: Release
